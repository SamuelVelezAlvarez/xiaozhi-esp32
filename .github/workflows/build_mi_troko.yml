name: Compilar Firmware 128x160

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar y Compilar ESP32-S3
        run: |
          . $IDF_PATH/export.sh
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI_LCD=y
          CONFIG_LCD_ST7735_128X160=y
          CONFIG_LANGUAGE_ES_ES=y
          CONFIG_USE_CUSTOM_WAKE_WORD=y
          CONFIG_CUSTOM_WAKE_WORD="ga el"
          CONFIG_CUSTOM_WAKE_WORD_DISPLAY="Gael"
          CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=28
          CONFIG_WAKE_WORD_DETECTION_IN_LISTENING=n
          EOF
          idf.py set-target esp32s3 || (cat build/log/idf_py_stderr_output_* && exit 1)
          idf.py build || (cat build/log/idf_py_stderr_output_* && exit 1)
          cd build
          esptool.py --chip esp32s3 merge_bin -o firmware_gael_128x160.bin @flash_args

      - name: Subir archivo .bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-gael-128x160
          path: build/firmware_gael_128x160.bin
