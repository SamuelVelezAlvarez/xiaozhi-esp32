name: Compilar Firmware 128x160

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar y Compilar ESP32-S3
        run: |
          idf.py set-target esp32s3
          cat << 'EOF' >> sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI_LCD=y
          CONFIG_LCD_ST7735_128X160=y
          CONFIG_LANGUAGE_ES_ES=y
          EOF
          rm -f sdkconfig
          idf.py build
          cd build
          esptool.py --chip esp32s3 merge_bin -o firmware_128x160.bin @flash_args

      - name: Subir archivo .bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-128x160
          path: build/firmware_128x160.bin
