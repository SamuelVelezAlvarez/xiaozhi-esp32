name: Compilar Firmware 128x160

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar y Compilar ESP32-S3
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cat << 'EOF' >> sdkconfig.defaults.esp32s3
          CONFIG_COMPILER_OPTIMIZATION_SIZE=y
          CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI_LCD=y
          # CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI is not set
          CONFIG_LCD_ST7735_128X160=y
          # CONFIG_LCD_ST7789_240X320 is not set
          CONFIG_LANGUAGE_ES_ES=y
          # CONFIG_LANGUAGE_EN_US is not set
          CONFIG_USE_CUSTOM_WAKE_WORD=y
          # CONFIG_USE_AFE_WAKE_WORD is not set
          # CONFIG_WAKE_WORD_DISABLED is not set
          CONFIG_CUSTOM_WAKE_WORD="ga el"
          CONFIG_CUSTOM_WAKE_WORD_DISPLAY="Gael"
          CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=28
          CONFIG_WAKE_WORD_DETECTION_IN_LISTENING=n
          CONFIG_SR_MN_CN_MULTINET7_QUANT=y
          EOF
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin

      - name: Subir archivo .bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-gael-128x160
          path: build/merged-binary.bin
          if-no-files-found: error
